name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "landing/**"
      - "video/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  suite:
    name: Suite del laboratorio (sin Odoo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias de test
        run: pip install -r requirements-dev.txt
      - name: Lint OCA del módulo (linter oficial de la OCA)
        run: python scripts/lint_oca.py
      - name: Comprobar el catálogo, el módulo y la lógica del panel
        run: python -m pytest tests -v
      - name: Resumen
        if: always()
        run: echo "Este job corre la suite autocontenida (sin Odoo). El job 'vivo' ejecuta las pruebas contra la demo pública en cada push y cron."
  vivo-tests:
    name: Suite de laboratorio vivo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias de test
        run: pip install -r requirements-dev.txt
      - name: Ejecutar tests vivo contra la demo pública
        run: python -m pytest tests/test_laboratorio_vivo.py -v
        env:
          MUEBLES_LAB: "1"
          MUEBLES_LAB_PANEL: "https://odoocrm.kavanasystems.com/panel"
          MUEBLES_LAB_ODOO: "https://odoocrm.kavanasystems.com"
