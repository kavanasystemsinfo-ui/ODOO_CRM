[options]
addons_path = /mnt/extra-addons,/mnt/extra-addons/muebles_crm
data_dir = /var/lib/odoo
log_level = info
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = furniture_db
proxy_mode = True

# Odoo 20 liga HTTP a 127.0.0.1 por defecto: dentro del contenedor el
# puerto publicado no llega a la app. Escuchar en toda la interfaz del contenedor.
http_interface = 0.0.0.0
