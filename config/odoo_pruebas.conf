[options]
# Odoo de las copias de prueba por visitante (contenedor furniture_odoo_pruebas).
# Solo ve las bases «muebles_demo_*»; nunca la demo ni la plantilla.
addons_path = /mnt/extra-addons,/mnt/extra-addons/muebles_crm
data_dir = /var/lib/odoo
log_level = info
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
dbfilter = ^muebles_demo_[a-z0-9]{4,12}$
proxy_mode = True
http_interface = 0.0.0.0
# Nunca el gestor de bases de datos.
list_db = False
# Sin tareas programadas: las copias duran una hora y están neutralizadas.
max_cron_threads = 0
# ODOO_CRM como módulo de servidor: /probar/entrar funciona antes de tener base.
server_wide_modules = base,rpc,web,ODOO_CRM
